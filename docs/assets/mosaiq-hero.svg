<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Mosaiq visual inspiration library</title>
  <desc id="desc">An animated, earthy illustration of visual references becoming an organized personal library.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#7b826f" stroke-opacity=".16"/>
    </pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#6f8064" fill-opacity=".34"/>
    </pattern>
    <clipPath id="screen">
      <rect x="384" y="120" width="932" height="524" rx="34"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#433f37" flood-opacity=".15"/>
    </filter>
    <linearGradient id="photo1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5a78d"/>
      <stop offset="1" stop-color="#745f55"/>
    </linearGradient>
    <linearGradient id="photo2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7c1a8"/>
      <stop offset="1" stop-color="#53624f"/>
    </linearGradient>
    <linearGradient id="photo3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8b8cf"/>
      <stop offset="1" stop-color="#72647d"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .serif { font-family: Iowan Old Style, Palatino Linotype, Georgia, serif; }
    .float-a { animation: floatA 7s ease-in-out infinite; transform-origin: center; }
    .float-b { animation: floatB 8.5s ease-in-out infinite; transform-origin: center; }
    .pulse { animation: pulse 3.5s ease-in-out infinite; }
    .blink { animation: blink 2.6s ease-in-out infinite; }
    @keyframes floatA { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
    @keyframes floatB { 0%,100% { transform: translateY(0) rotate(1deg); } 50% { transform: translateY(8px) rotate(-1deg); } }
    @keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @keyframes blink { 0%,35%,100% { opacity:.18; } 50%,80% { opacity:.65; } }
    @media (prefers-reduced-motion: reduce) {
      .float-a,.float-b,.pulse,.blink { animation:none; }
    }
  </style>

  <rect width="1400" height="720" rx="42" fill="#efe8dc"/>
  <rect width="1400" height="720" rx="42" fill="url(#grid)"/>
  <path d="M0 548C171 484 270 596 440 551S710 448 887 503s278 143 513 54v163H0Z" fill="#c8b7a1" opacity=".62"/>
  <path d="M0 622c190-55 349 32 506-2 201-43 312-113 502-56 168 51 254 66 392 16v140H0Z" fill="#8f9a82" opacity=".72"/>
  <circle cx="1214" cy="90" r="122" fill="#d49a83" opacity=".32"/>
  <rect x="1160" y="24" width="210" height="170" fill="url(#dots)" opacity=".75"/>

  <g transform="translate(76 92)">
    <circle cx="29" cy="29" r="29" fill="#343b32"/>
    <circle cx="29" cy="29" r="12" fill="#efe8dc"/>
    <circle cx="38" cy="20" r="9" fill="#c9856e"/>
    <text x="0" y="104" class="serif" font-size="68" font-weight="700" fill="#343b32">Mosaiq</text>
    <text x="3" y="143" class="sans" font-size="14" font-weight="700" letter-spacing="3.5" fill="#6f6a60">PRIVATE VISUAL LIBRARY</text>
    <text x="3" y="202" class="serif" font-size="22" fill="#4d5148">Save what catches your eye.</text>
    <text x="3" y="234" class="serif" font-size="22" font-style="italic" fill="#a75f4c">Remember why it mattered.</text>

    <g class="float-b" transform="translate(0 318)">
      <rect width="250" height="54" rx="27" fill="#f7f2e9" stroke="#757a6d"/>
      <circle cx="29" cy="27" r="6" fill="#c9856e"/>
      <text x="48" y="34" class="sans" font-size="16" font-weight="650" fill="#41473d">earthy colour palette</text>
    </g>
    <g class="float-a" transform="translate(56 390)">
      <rect width="206" height="54" rx="27" fill="#343b32"/>
      <text x="28" y="34" class="sans" font-size="16" font-weight="650" fill="#f3ede2">why it works ↗</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="364" y="100" width="972" height="564" rx="42" fill="#f8f4ec" stroke="#5f635a" stroke-width="2"/>
    <g clip-path="url(#screen)">
      <rect x="384" y="120" width="932" height="524" fill="#f7f3eb"/>
      <rect x="384" y="120" width="190" height="524" fill="#343b32"/>
      <circle cx="424" cy="164" r="14" fill="#d59a83"/>
      <text x="449" y="171" class="serif" font-size="25" font-weight="700" fill="#f3ede2">Mosaiq</text>
      <rect x="406" y="253" width="148" height="42" rx="12" fill="#596251"/>
      <g class="sans" font-size="15" fill="#c8cbbf">
        <text x="420" y="232">⌂   Home</text>
        <text x="420" y="278" fill="#fff">◫   Library</text>
        <text x="420" y="324">✓   Inbox</text>
        <text x="420" y="370">◇   Collections</text>
        <text x="420" y="416">⌕   Search</text>
      </g>

      <text x="614" y="172" class="sans" font-size="14" font-weight="750" letter-spacing="3.4" fill="#8b7d6e">YOUR VISUAL MEMORY</text>
      <text x="614" y="221" class="serif" font-size="43" font-weight="700" fill="#343b32">The library</text>
      <rect x="1110" y="170" width="162" height="46" rx="23" fill="#343b32"/>
      <text x="1141" y="199" class="sans" font-size="15" font-weight="700" fill="#f7f3eb">＋ Add images</text>

      <g class="float-a">
        <rect x="614" y="259" width="204" height="294" rx="23" fill="#ece4d8" stroke="#c7bbab"/>
        <rect x="630" y="275" width="172" height="176" rx="16" fill="url(#photo1)"/>
        <circle cx="716" cy="355" r="52" fill="#ead7c7" opacity=".72"/>
        <path d="M664 404c30-58 63-98 110-117v117Z" fill="#614f48" opacity=".84"/>
        <text x="636" y="486" class="serif" font-size="19" font-weight="700" fill="#343b32">Editorial warmth</text>
        <text x="636" y="516" class="sans" font-size="13" fill="#7c7469">branding · typography</text>
        <circle cx="780" cy="520" r="8" fill="#c9856e"/>
      </g>

      <g class="float-b">
        <rect x="838" y="259" width="204" height="258" rx="23" fill="#e4e8de" stroke="#bdc4b5"/>
        <rect x="854" y="275" width="172" height="140" rx="16" fill="url(#photo2)"/>
        <rect x="874" y="306" width="79" height="87" rx="40" fill="#d8c8af"/>
        <path d="M854 391c52-47 109-67 172-60v84H854Z" fill="#415446" opacity=".78"/>
        <text x="860" y="451" class="serif" font-size="22" font-weight="700" fill="#343b32">Quiet interiors</text>
        <text x="860" y="481" class="sans" font-size="13" fill="#70776b">light · material · mood</text>
      </g>

      <g class="float-a">
        <rect x="1062" y="259" width="204" height="314" rx="23" fill="#e7e0eb" stroke="#c5b9ca"/>
        <rect x="1078" y="275" width="172" height="196" rx="16" fill="url(#photo3)"/>
        <text x="1096" y="350" class="serif" font-size="58" font-style="italic" fill="#f6efe5">Aa</text>
        <path d="M1096 384h126M1096 403h88M1096 422h106" stroke="#f4eadf" stroke-width="5" stroke-linecap="round" opacity=".78"/>
        <text x="1084" y="508" class="serif" font-size="22" font-weight="700" fill="#343b32">Type study</text>
        <text x="1084" y="538" class="sans" font-size="13" fill="#756b79">poster · composition</text>
      </g>

      <g class="pulse">
        <rect x="789" y="578" width="294" height="44" rx="22" fill="#fffaf2" stroke="#c9856e"/>
        <circle cx="815" cy="600" r="6" fill="#c9856e"/>
        <text x="832" y="606" class="sans" font-size="14" font-weight="650" fill="#5c5148">Finding the visual thread…</text>
        <circle cx="1047" cy="600" r="3.5" fill="#c9856e"/>
        <circle cx="1058" cy="600" r="3.5" fill="#c9856e" opacity=".58"/>
        <circle cx="1069" cy="600" r="3.5" fill="#c9856e" opacity=".28"/>
      </g>
    </g>
  </g>

  <g class="blink">
    <circle cx="1308" cy="628" r="5" fill="#343b32"/>
    <circle cx="1330" cy="628" r="5" fill="#343b32"/>
    <circle cx="1352" cy="628" r="5" fill="#343b32"/>
  </g>
</svg>
