services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: mosaiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mosaiq_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosaiq"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  mosaiq_postgres:
